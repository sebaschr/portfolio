<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 34 30" shape-rendering="crispEdges">
  <defs>
    <g id="cat-body">
      <rect x="8" y="0" width="1" height="1" />
      <rect x="9" y="0" width="1" height="1" />
      <rect x="8" y="1" width="2" height="1" />
      <rect x="7" y="2" width="4" height="1" />
      <rect x="7" y="3" width="4" height="1" />
      <rect x="6" y="4" width="6" height="1" />
      <rect x="6" y="5" width="6" height="1" />
      <rect x="13" y="0" width="1" height="1" />
      <rect x="14" y="0" width="1" height="1" />
      <rect x="13" y="1" width="2" height="1" />
      <rect x="12" y="2" width="4" height="1" />
      <rect x="12" y="3" width="4" height="1" />
      <rect x="11" y="4" width="6" height="1" />
      <rect x="11" y="5" width="6" height="1" />
      <rect x="4" y="6" width="15" height="1" />
      <rect x="2" y="7" width="18" height="1" />
      <rect x="1" y="8" width="20" height="1" />
      <rect x="0" y="9" width="21" height="1" />
      <rect x="0" y="10" width="21" height="1" />
      <rect x="0" y="11" width="21" height="1" />
      <rect x="0" y="12" width="21" height="1" />
      <rect x="0" y="13" width="20" height="1" />
      <rect x="1" y="14" width="18" height="1" />
      <rect x="2" y="15" width="15" height="1" />
      <rect x="4" y="16" width="10" height="1" />
    </g>
    <g id="cat-face">
      <g fill="#fff">
        <rect x="8" y="2" width="2" height="2" />
        <rect x="13" y="2" width="2" height="2" />
        <rect x="5" y="10" width="3" height="2" />
        <rect x="12" y="10" width="3" height="2" />
      </g>
      <g fill="#1a1a1a">
        <rect x="6" y="10" width="1" height="1" />
        <rect x="13" y="10" width="1" height="1" />
      </g>
    </g>
  </defs>

  <!-- back cat: secondary-red -->
  <g transform="translate(0, 0)">
    <g fill="#C1121F">
      <use href="#cat-body" />
    </g>
    <use href="#cat-face" />
  </g>

  <!-- front cat: primary, offset diagonally -->
  <g transform="translate(11, 11)">
    <g fill="#780000">
      <use href="#cat-body" />
    </g>
    <use href="#cat-face" />
  </g>
</svg>
